<body>

    <div class="login-container">
        <div class="login-box">
            <h2 id="auth-title">INICIAR SESIÓN</h2>
            <p id="auth-subtitle">Accedé a tus favoritos y datos de envío.</p>

            <form id="auth-form">
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Contraseña" required>
                </div>
                
                <button type="submit" id="btn-auth" class="btn-primary">ENTRAR</button>
            </form>

            <div class="auth-options">
                <p id="toggle-auth">¿No tenés cuenta? <span>Registrate aquí</span></p>
                <hr>
                <button id="btn-google" class="btn-google">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google">
                    Continuar con Google
                </button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    
    <script src="js/config.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
